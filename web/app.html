<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#FF2010">
<title>DIG</title>
<script src="https://sdk.scdn.co/spotify-player.js"></script>
<div id="yt-host" style="position:absolute;width:1px;height:1px;overflow:hidden;top:-10px;left:-10px;"></div>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html { background: #000; }
body { background: #000; color: #ddd; font-family: -apple-system, system-ui, sans-serif; height: 100vh; display: flex; flex-direction: column; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }

/* TOP BAR — always visible */
#topbar {
  flex-shrink: 0; background: #0c0c0c; border-bottom: 1px solid #151515;
  display: flex; align-items: center; gap: 12px; padding: 10px 20px; height: 64px;
}
#topbar-logo { font-size: 15px; font-weight: 800; letter-spacing: 2px; color: #FF2010; flex-shrink: 0; }
#player-art {
  width: 44px; height: 44px; border-radius: 6px; background: #151515;
  flex-shrink: 0; overflow: hidden; display: flex; align-items: center; justify-content: center;
}
#player-art img { width: 100%; height: 100%; object-fit: cover; }
#player-art .no-art { color: #222; font-size: 20px; }
#player-info { flex: 1; min-width: 0; }
#player-track { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#player-artist { font-size: 11px; color: #777; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#player-region-tag { font-size: 9px; color: #444; margin-top: 1px; }
#player-progress { flex: 0 0 100px; height: 3px; background: #1a1a1a; border-radius: 2px; cursor: pointer; }
#player-progress-fill { height: 100%; background: #FF2010; border-radius: 2px; width: 0%; transition: width 0.4s linear; }
#player-time { font-size: 10px; color: #444; flex-shrink: 0; width: 34px; text-align: right; }
.p-btn {
  width: 32px; height: 32px; border-radius: 6px; border: none; background: #1a1a1a;
  color: #888; font-size: 13px; cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
}
.p-btn:hover { background: #252525; color: #ddd; }
.p-btn.save-btn { font-size: 15px; }
.p-btn.save-btn.saved { background: #3a1a0a; color: #FF2010; }
.p-btn.nah-btn { font-size: 13px; }
.p-btn.nah-btn.disliked { background: #1a1a10; color: #666; }
.p-btn.tailored-active { background: #1a2030; color: #4a9eff; box-shadow: 0 0 6px rgba(74,158,255,0.3); }
.p-btn.aimix-active { background: #2a1a30; color: #d29eff; box-shadow: 0 0 6px rgba(210,158,255,0.4); }
.p-btn.journey-active { background: #1f2a1a; color: #aef0a0; box-shadow: 0 0 6px rgba(174,240,160,0.4); }
#player-status { font-size: 10px; color: #555; flex-shrink: 0; }
.tab-btn {
  width: 32px; height: 32px; border-radius: 6px; border: 1px solid #1a1a1a; background: transparent;
  color: #555; font-size: 12px; cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
  margin-left: 4px;
}
.tab-btn:hover { border-color: #333; color: #aaa; }
.tab-btn.active { background: #FF2010; border-color: #FF2010; color: #fff; }

/* PAGES */
#pages { flex: 1; overflow: hidden; position: relative; }
.page { display: none; height: 100%; overflow-y: auto; }
.page.active { display: flex; flex-direction: column; height: 100%; min-height: 0; }

/* PLAYER PAGE */
#player-page {
  align-items: center; justify-content: center; flex: 1;
}
.player-center { max-width: 400px; width: 100%; text-align: center; }
.player-center #big-art {
  width: 100%; max-width: 360px; aspect-ratio: 1; border-radius: 14px; background: transparent;
  margin: 0 auto 24px; overflow: hidden; display: flex; align-items: center; justify-content: center;
  position: relative;
}
.player-center #big-art.has-art { background: #111; }
.player-center #big-art img { width: 100%; height: 100%; object-fit: cover; }
.player-center #big-art .no-art { color: #1a1a1a; font-size: 80px; display: none; }
#big-play-btn {
  width: 160px; height: 160px; display: flex; align-items: center; justify-content: center;
  background: #FF2010; border: none; cursor: pointer; border-radius: 50%;
  -webkit-tap-highlight-color: transparent; position: relative;
  transition: background 0.15s;
}
#big-play-btn:hover { background: #E61C0E; }
#big-play-btn:active { background: #CC180C; }
#big-play-btn svg { width: 64px; height: 64px; margin-left: 8px; }
#big-play-btn .play-tri { fill: #000; }
.player-center .pc-track { font-size: 20px; font-weight: 700; }
.player-center .pc-artist { font-size: 15px; color: #777; margin-top: 4px; }
.player-center .pc-region { font-size: 11px; color: #444; margin-top: 6px; }
.player-center .pc-hint { font-size: 11px; color: #555; margin-top: 20px; letter-spacing: 0.5px; }

/* Mobile controls */
.mc-mode {
  background: #111; border: 1px solid #222; color: #555; font-size: 11px;
  padding: 6px 14px; border-radius: 20px; cursor: pointer;
  font-family: inherit; transition: all 0.15s;
}
.mc-mode:active { background: #1a1a1a; }
.mc-mode.mc-mode-active { border-color: #333; color: #ddd; background: #1a1a1a; }
.mc-mode.mc-mode-tailored { }
.mc-mode.mc-mode-aimix.mc-mode-active { border-color: #3a2a4a; color: #d29eff; background: #1a1028; }
.mc-mode.mc-mode-tailored.mc-mode-active { border-color: #1a2a3a; color: #4a9eff; background: #0f1820; }
.mc-mode.mc-mode-journey.mc-mode-active { border-color: #2a3a1a; color: #aef0a0; background: #141f10; }

.mc-transport { width: 44px; height: 44px; font-size: 14px; letter-spacing: -3px; }

.mc-btn {
  width: 44px; height: 44px; border-radius: 50%; border: none; background: #1a1a1a;
  color: #888; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center;
  -webkit-tap-highlight-color: transparent;
}
.mc-btn:active { background: #252525; color: #ddd; }
.mc-btn.mc-play { width: 56px; height: 56px; font-size: 22px; background: #FF2010; color: #fff; }
.mc-btn.mc-play:active { background: #E61C0E; }
.mc-btn.mc-save.saved { background: #3a1a0a; color: #FF2010; }
.mc-btn.mc-nah.disliked { background: #1a1a10; color: #666; }

/* Heart animation overlay */
.art-overlay {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0);
  font-size: 100px; pointer-events: none; opacity: 0; z-index: 10;
}
.art-overlay.heart { color: #FF2010; text-shadow: 0 0 40px rgba(255,32,16,0.6); }
.art-overlay.nah { color: #555; text-shadow: 0 0 30px rgba(80,80,80,0.4); }
.art-overlay.pop {
  animation: overlayPop 0.7s ease-out forwards;
}
@keyframes overlayPop {
  0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
  15% { transform: translate(-50%, -50%) scale(1.3); opacity: 1; }
  30% { transform: translate(-50%, -50%) scale(1.0); opacity: 1; }
  60% { transform: translate(-50%, -50%) scale(1.0); opacity: 0.8; }
  100% { transform: translate(-50%, -50%) scale(1.1); opacity: 0; }
}

/* LEDGER PAGE */
#ledger-page {}
#filters {
  padding: 10px 20px; background: #0a0a0a; border-bottom: 1px solid #111;
  display: flex; gap: 6px; flex-wrap: wrap; align-items: center; flex-shrink: 0;
}
#search {
  padding: 5px 10px; background: #111; border: 1px solid #1a1a1a; border-radius: 5px;
  color: #ddd; font-size: 12px; outline: none; width: 160px;
}
#search:focus { border-color: #FF2010; }
.chip {
  padding: 3px 9px; border-radius: 4px; border: 1px solid #1a1a1a; background: #111;
  color: #666; font-size: 11px; cursor: pointer; white-space: nowrap;
}
.chip:hover { border-color: #333; color: #aaa; }
.chip.active { background: #FF2010; border-color: #FF2010; color: #fff; }

/* View toggle */
.view-toggle {
  margin-left: 8px; display: flex; gap: 2px;
}
.view-btn {
  width: 26px; height: 22px; border: 1px solid #1a1a1a; background: #111;
  color: #555; font-size: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center;
}
.view-btn:first-child { border-radius: 4px 0 0 4px; }
.view-btn:last-child { border-radius: 0 4px 4px 0; }
.view-btn:not(:first-child):not(:last-child) { border-radius: 0; }
.view-btn:hover { border-color: #333; color: #aaa; }
.view-btn.active { background: #FF2010; border-color: #FF2010; color: #fff; }

#filter-info { margin-left: auto; font-size: 10px; color: #333; }

/* Explore view */
#explore-view { display: none; flex: 1; position: relative; overflow: hidden; }
#explore-view.active { display: flex; flex-direction: column; }
#explore-canvas { display: block; flex: 1; width: 100%; }
#explore-toolbar {
  display: flex; gap: 4px; padding: 6px 10px; background: #0a0a0a; border-bottom: 1px solid #151515;
  align-items: center; flex-shrink: 0;
}
.explore-mode {
  padding: 3px 10px; border-radius: 4px; border: 1px solid #1a1a1a; background: #111;
  color: #555; font-size: 10px; cursor: pointer; white-space: nowrap;
}
.explore-mode:hover { border-color: #333; color: #aaa; }
.explore-mode.active { background: #FF2010; border-color: #FF2010; color: #fff; }
#explore-search {
  margin-left: auto; background: #111; border: 1px solid #222; color: #aaa; padding: 4px 10px;
  border-radius: 12px; font-size: 11px; width: 140px; outline: none; font-family: inherit;
}
#explore-search:focus { border-color: #FF2010; }
#explore-search::placeholder { color: #333; }
#explore-tooltip {
  display: none; position: fixed; pointer-events: none; z-index: 200;
  background: #111; border: 1px solid #282828; border-radius: 8px;
  padding: 10px 14px; font-size: 12px; max-width: 280px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.6);
}
.ett-track { color: #fff; font-weight: 700; font-size: 13px; margin-bottom: 2px; }
.ett-artist { color: #999; font-size: 11px; margin-bottom: 4px; }
.ett-labels { font-size: 10px; color: #555; line-height: 1.5; }
.ett-labels span { display: inline-block; background: #1a1a1a; padding: 1px 6px; border-radius: 3px; margin: 1px 2px; }
.ett-play { color: #FF2010; font-size: 10px; margin-top: 4px; }

#feed { flex: 1; overflow-y: auto; }
.feed-item {
  display: flex; align-items: center; gap: 12px; padding: 10px 20px;
  border-bottom: 1px solid #0e0e0e; font-size: 13px;
}
.feed-item:hover { background: #0c0c0c; }
.feed-icon { width: 16px; text-align: center; flex-shrink: 0; font-size: 10px; color: #555; }
.feed-icon.listened { color: #FF2010; }
.feed-icon.saved { color: #FF2010; }
.feed-icon.skipped { color: #664; }
.feed-icon.disliked { color: #555; }
.feed-text { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.feed-tags { font-size: 10px; color: #333; flex-shrink: 0; }
.feed-actions { display: flex; gap: 2px; flex-shrink: 0; opacity: 0; transition: opacity 0.15s; }
.feed-item:hover .feed-actions { opacity: 1; }
.feed-btn { background: none; border: none; color: #444; font-size: 12px; cursor: pointer; padding: 2px 6px; border-radius: 4px; }
.feed-btn:hover { color: #ddd; background: #1a1a1a; }
.feed-btn.active-save { color: #FF2010; }
.feed-btn.active-dislike { color: #666; }

/* MOBILE */
@media (max-width: 600px) {
  /* Hide topbar entirely — mobile uses the 3-tier controls instead */
  #topbar { display: none !important; }
  /* Hide ledger tab — player-only on mobile */
  #tab-ledger, #tab-player { display: none !important; }
  /* Full-screen player */
  #pages { top: 0; }
  #player-page { padding-top: env(safe-area-inset-top, 0); }

  /* Player page — mobile controls */
  .player-center { padding: 16px 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; min-height: 100dvh; }
  .player-center #big-art { max-width: 300px; width: 80vw; margin-bottom: 20px; }
  .player-center .pc-track { font-size: 19px; text-align: center; }
  .player-center .pc-artist { font-size: 14px; text-align: center; }
  .player-center .pc-region { font-size: 11px; text-align: center; color: #444; margin-top: 4px; max-width: 90vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .player-center .pc-hint { display: none; }

  /* Mobile 3-tier controls */
  .mobile-controls { display: flex !important; }
  .pc-hint { display: none; }

  /* Feed — keep styles for when ledger IS shown (e.g., landscape or future toggle) */
  .feed-actions { opacity: 1 !important; }
  .feed-item { padding: 10px 12px; gap: 8px; }
  .feed-text { font-size: 12px; }
  #filters { padding: 8px 12px; gap: 4px; }
  .chip { font-size: 10px; padding: 3px 7px; }
  #search { width: 100px; font-size: 11px; }
  .view-toggle { display: flex; }
  #filter-info { font-size: 9px; }
}

/* MAP VIEW */
#map-view { display: none; flex: 1; overflow-y: auto; padding: 16px 20px; }
#map-view.active { display: flex; flex-direction: column; }
.map-dim-tabs {
  display: flex; gap: 4px; margin-bottom: 12px;
}
.map-dim-tab {
  padding: 3px 10px; border-radius: 4px; border: 1px solid #1a1a1a; background: #111;
  color: #555; font-size: 10px; cursor: pointer;
}
.map-dim-tab:hover { border-color: #333; color: #aaa; }
.map-dim-tab.active { background: #FF2010; border-color: #FF2010; color: #fff; }
.map-context-toggle {
  font-size: 10px; color: #444; cursor: pointer; margin-bottom: 12px; user-select: none; display: inline-block;
}
.map-context-toggle:hover { color: #888; }
.map-row {
  display: flex; align-items: center; gap: 10px; margin-bottom: 8px;
}
.map-row-label {
  width: 110px; font-size: 11px; color: #555; text-align: right; flex-shrink: 0;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.map-row-label.explored { color: #ddd; }
.map-row-bar {
  flex: 1; height: 10px; background: #111; border-radius: 5px; overflow: hidden; position: relative;
}
.map-row-world {
  position: absolute; top: 0; left: 0; height: 100%; background: #1e1e1e; border-radius: 5px;
  transition: width 0.3s;
}
.map-row-user {
  position: absolute; top: 0; left: 0; height: 100%; background: #FF2010; border-radius: 5px;
  transition: width 0.3s; z-index: 1;
}
.map-row-count {
  width: 40px; font-size: 10px; color: #444; flex-shrink: 0;
}
.map-row-saved {
  font-size: 9px; color: #FF2010; width: 36px; flex-shrink: 0;
}

::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-thumb { background: #1a1a1a; border-radius: 2px; }
</style>
</head>
<body>

<!-- TOP BAR — always visible -->
<div id="topbar">
  <div id="topbar-logo">DIG</div>
  <div id="player-art"><div class="no-art">♫</div></div>
  <div id="player-info">
    <div id="player-track">DIG</div>
    <div id="player-artist">press space to start</div>
    <div id="player-region-tag"></div>
  </div>
  <div id="player-progress"><div id="player-progress-fill"></div></div>
  <div id="player-time">0:00</div>
  <button class="p-btn" id="btn-songback" title="Previous song" style="font-size:10px;">⏮</button>
  <button class="p-btn" id="btn-prev" title="Back 15s">◁</button>
  <button class="p-btn" id="btn-play" title="Play/Pause">▶</button>
  <button class="p-btn" id="btn-fwd" title="Forward 15s">▷</button>
  <button class="p-btn" id="btn-skip" title="Next song" style="font-size:10px;">⏭</button>
  <button class="p-btn save-btn" id="btn-save" title="Save (↑)">♡</button>
  <button class="p-btn nah-btn" id="btn-nah" title="Dislike (↓)">✕</button>
  <button class="p-btn" id="btn-tailored" title="Tailored mode" style="font-size:10px; letter-spacing:0.5px;">⊙</button>
  <button class="p-btn" id="btn-aimix" title="AI Mix — Claude curates" style="font-size:10px; letter-spacing:0.5px;">✦</button>
  <button class="p-btn" id="btn-journey" title="Journey — start a seeded journey from this track" style="font-size:11px;">🛫</button>
  <button class="p-btn" id="btn-journey-exit" title="Exit journey" style="font-size:9px; display:none; color:#666;">✕</button>
  <div id="player-status"></div>
  <button class="tab-btn active" id="tab-player" title="Player">♫</button>
  <button class="tab-btn" id="tab-ledger" title="Ledger">☰</button>
  <a id="login-link" href="/login" style="font-size:10px; color:#555; text-decoration:none; flex-shrink:0; margin-left:4px;">sign in</a>
  <a id="user-btn" href="/logout" title="Logout" style="display:none; width:28px; height:28px; border-radius:50%; overflow:hidden; flex-shrink:0; margin-left:4px;">
    <img id="user-avatar" src="" style="width:100%; height:100%; object-fit:cover;">
  </a>
</div>

<!-- PAGES -->
<div id="pages">
  <!-- PLAYER PAGE -->
  <div id="player-page" class="page active">
    <div class="player-center">
      <div id="big-art">
        <button id="big-play-btn" onclick="handlePlay()">
          <svg viewBox="0 0 80 80"><polygon class="play-tri" points="28,16 28,64 64,40" /></svg>
        </button>
        <div class="art-overlay heart" id="heart-overlay">♥</div>
        <div class="art-overlay nah" id="nah-overlay">✕</div>
      </div>
      <div class="pc-track" id="pc-track">DIG</div>
      <div class="pc-artist" id="pc-artist">press play to start discovering</div>
      <div class="pc-region" id="pc-region"></div>
      <!-- MOBILE: 3-tier control layout -->
      <div class="mobile-controls" style="display:none; flex-direction:column; align-items:center; gap:14px; margin-top:20px; width:100%;">
        <!-- Tier 1: Transport — outer=song skip, inner=15s seek, center=play -->
        <div class="mc-tier" style="display:flex; align-items:center; justify-content:center; gap:10px;">
          <button class="mc-btn mc-transport" id="mc-songback" title="Previous song">◁◁</button>
          <button class="mc-btn mc-transport" id="mc-prev" title="Back 15s">◁</button>
          <button class="mc-btn mc-play" id="mc-play" title="Play">▶</button>
          <button class="mc-btn mc-transport" id="mc-fwd" title="Forward 15s">▷</button>
          <button class="mc-btn mc-transport" id="mc-skip" title="Next song">▷▷</button>
        </div>
        <!-- Tier 2: Like / Dislike -->
        <div class="mc-tier" style="display:flex; align-items:center; justify-content:center; gap:24px;">
          <button class="mc-btn mc-nah" id="mc-nah" title="Nah" style="width:48px; height:48px; font-size:18px;">✕</button>
          <button class="mc-btn mc-save" id="mc-save" title="Save" style="width:48px; height:48px; font-size:18px;">♡</button>
        </div>
        <!-- Tier 3: Modes + sign in -->
        <div class="mc-tier" style="display:flex; align-items:center; justify-content:center; gap:8px; flex-wrap:wrap;">
          <button class="mc-mode" id="mc-tailored" title="Tailored">⊙ tailored</button>
          <button class="mc-mode" id="mc-aimix" title="AI Mix">✦ explore</button>
          <button class="mc-mode" id="mc-journey" title="Journey from this track">🛫 journey</button>
          <button class="mc-mode" id="mc-journey-exit" title="Exit journey" style="display:none; color:#f66;">✕ exit</button>
          <a href="/login" class="mc-mode" id="mc-login" style="text-decoration:none; display:none;">sign in</a>
        </div>
      </div>
      <div class="pc-hint">space pause · ← → skip 15s · ⌘→ next · ↑ save · ↓ nah</div>
      <div id="debug" style="display:none;"></div>
    </div>
  </div>

  <!-- LEDGER PAGE -->
  <div id="ledger-page" class="page">
    <div id="filters">
      <input id="search" placeholder="Search..." />
      <div class="chip active" data-f="all">All</div>
      <div class="chip" data-f="listened">Listened</div>
      <div class="chip" data-f="saved">Saved</div>
      <div class="chip" data-f="skipped">Skipped</div>
      <div class="chip" data-f="disliked">Disliked</div>
      <div class="chip" data-f="known">Library</div>
      <div class="view-toggle">
        <button class="view-btn active" id="view-list" title="List">☰</button>
        <button class="view-btn" id="view-map" title="Bars">◉</button>
        <button class="view-btn" id="view-explore" title="Explore">✦</button>
      </div>
      <div id="filter-info"></div>
    </div>
    <div id="feed"></div>
    <div id="map-view"></div>
    <div id="explore-view">
      <div id="explore-toolbar">
        <div class="explore-mode active" data-mode="genre">Genre</div>
        <div class="explore-mode" data-mode="region">Region</div>
        <div class="explore-mode" data-mode="year">Year</div>
        <span style="width:1px;height:16px;background:#222;margin:0 4px;"></span>
        <div class="explore-mode active" id="tog-pool">Pool</div>
        <div class="explore-mode" id="tog-hist">History</div>
        <input id="explore-search" placeholder="search..." autocomplete="off">
      </div>
      <canvas id="explore-canvas"></canvas>
      <div id="explore-tooltip">
        <div class="ett-track"></div>
        <div class="ett-artist"></div>
        <div class="ett-labels"></div>
        <div class="ett-play">click to play</div>
      </div>
    </div>
  </div>
</div>

<script>
// ===== STATE =====
let DATA, DISC, GENRE_MAP = null;
let allDiscovery = [];  // all discovery tracks, shuffled
let dIdx = 0;
let currentFilter = 'all';
let currentView = 'list'; // 'list' or 'map'
let showWorldContext = true;

// ── Tailored mode: taste gravity ──
let tailoredMode = false;
let allTracksPool = [];  // flat array of all tracks (for dynamic picking)
let playedIds = new Set(); // tracks already played this session
// Session taste signals: { id, genre, region, energy, mood, genres[], action, trackIndex, strength }
let tasteSignals = [];
let _tailoredTrackCount = 0; // monotonic counter of tracks played in tailored mode

function getTasteAffinity(track) {
  // Compute how much gravity pulls toward this track based on recent signals.
  // Returns a score: positive = attracted, negative = repelled, 0 = neutral.
  // Decay is by track count (half-life = 20 tracks), not wall-clock time.
  if (!tasteSignals.length) return 0;

  let affinity = 0;
  const now = _tailoredTrackCount;
  const trackGenre = (track._genre || '').toLowerCase();
  const trackGenres = (track.genres || []).map(g => g.toLowerCase());
  const trackRegion = track.region;
  const trackEnergy = track._energy;
  const trackMood = track._mood;

  for (const sig of tasteSignals) {
    // Exponential decay: half-life of 20 tracks played
    const age = now - sig.trackIndex;
    const decay = Math.exp(-age * Math.LN2 / 20);
    if (decay < 0.05) continue; // effectively gone after ~90 tracks

    const weight = sig.strength * decay;

    // Genre similarity via embedding neighbors
    let genreSim = 0;
    if (GENRE_MAP && GENRE_MAP.neighbors) {
      const sigGenre = sig.genre?.toLowerCase();
      // Direct match
      if (trackGenre === sigGenre) {
        genreSim = 1.0;
      } else {
        // Check if track's genre is in signal's top-10 neighbors
        const neighbors = GENRE_MAP.neighbors[sigGenre];
        if (neighbors) {
          const nIdx = neighbors.indexOf(trackGenre);
          if (nIdx >= 0) genreSim = 0.8 - nIdx * 0.07; // 0.8 → 0.1
        }
        // Also check secondary genres
        for (const tg of trackGenres) {
          if (tg === sigGenre) { genreSim = Math.max(genreSim, 0.9); break; }
          const nb = GENRE_MAP.neighbors[sigGenre];
          if (nb) {
            const ni = nb.indexOf(tg);
            if (ni >= 0) genreSim = Math.max(genreSim, 0.7 - ni * 0.06);
          }
        }
      }
    } else {
      // No embedding map — fallback to exact genre match
      genreSim = trackGenre === sig.genre ? 1.0 : 0;
    }

    // Mood/energy similarity (soft match)
    const moodSim = trackMood === sig.mood ? 0.5 : 0;
    const energySim = trackEnergy === sig.energy ? 0.3 : 0;

    // Combine: genre similarity is the primary signal
    // But rotate dimension: if genre matches strongly, DON'T also boost same region
    // This creates the "same vibe, different world" effect
    let dimSim = genreSim * 0.6 + moodSim * 0.25 + energySim * 0.15;

    // Penalty for same region when genre already matches (force exploration)
    if (genreSim > 0.5 && trackRegion === sig.region) {
      dimSim *= 0.6; // reduce affinity for same-genre-same-region
    }

    affinity += weight * dimSim;
  }

  return affinity;
}

function recordTasteSignal(track, action, pct) {
  // Weighted by listen completeness (Instagram-style).
  //   save     → strong like, regardless of pct (user explicit)
  //   dislike  → strong negative, regardless of pct (explicit)
  //   listened → +0.30 if pct ≥70, +0.15 if 30–70, +0 if <30
  //   skip     → -0.40 if pct <10 (instant skip), -0.10 if 10–50, +0.10 if ≥70 (sat through, then moved on)
  const playedPct = (pct == null && typeof getPlayedPct === 'function') ? getPlayedPct() : pct;
  let strength = 0;
  if (action === 'save') strength = 1.0;
  else if (action === 'dislike') strength = -0.8;
  else if (action === 'listened') {
    if (playedPct == null) strength = 0.15;
    else if (playedPct >= 70) strength = 0.30;
    else if (playedPct >= 30) strength = 0.15;
    else strength = 0;
  } else if (action === 'skip') {
    if (playedPct == null) strength = -0.20;
    else if (playedPct < 10) strength = -0.40;
    else if (playedPct < 50) strength = -0.10;
    else if (playedPct >= 70) strength = 0.10; // listened most then moved on
    else strength = -0.05;
  }
  if (strength === 0) return;

  if (action !== 'dislike' && action !== 'skip') _tailoredTrackCount++;

  tasteSignals.push({
    id: track.id,
    genre: (track._genre || '').toLowerCase(),
    genres: (track.genres || []).map(g => g.toLowerCase()),
    region: track.region,
    energy: track._energy,
    mood: track._mood,
    action,
    strength,
    trackIndex: _tailoredTrackCount,
  });

  // Keep only last 100 signals (enough for ~90-track decay window)
  if (tasteSignals.length > 100) tasteSignals = tasteSignals.slice(-100);
}

// ── Taste dimension decomposition ─────────────────────────────────────────
// Pre-loaded from server (/api/taste-profile) which JOINs user_history saves
// with the tracks table — covers ALL 638+ saves, not just those currently
// in the client-side pool (which misses most).
let _serverTasteProfile = null;
let _serverFeelPairs = null;  // co-occurrence pairs: "energy|mood" → count

async function _loadTasteProfile() {
  try {
    const r = await fetch('/api/taste-profile');
    const data = await r.json();
    if (data.profile) {
      _serverTasteProfile = data.profile;
      _serverFeelPairs = data.feel_pairs || {};
      const pairCount = Object.keys(_serverFeelPairs).length;
      console.log(`[DIG tailored] taste profile loaded: ${data.saves_matched} saves, ${pairCount} feel-pairs`,
                   Object.fromEntries(Object.entries(data.profile).map(([k, v]) => [k, Object.keys(v).length + ' values'])));
    }
  } catch (e) {
    console.warn('[DIG tailored] taste profile load failed:', e);
  }
}

function _buildTasteProfile() {
  // Use server-provided profile if available (covers all historical saves)
  if (_serverTasteProfile) {
    // Merge with session-only tasteSignals for real-time responsiveness
    const profile = JSON.parse(JSON.stringify(_serverTasteProfile)); // deep copy
    for (const sig of tasteSignals) {
      if (sig.strength <= 0) continue;
      const w = sig.strength;
      if (sig.energy && sig.energy !== 'unknown')
        profile.energies[sig.energy] = (profile.energies[sig.energy] || 0) + w;
      if (sig.mood && sig.mood !== 'unknown')
        profile.moods[sig.mood] = (profile.moods[sig.mood] || 0) + w;
      if (sig.genre && sig.genre !== 'unknown')
        profile.genres[sig.genre] = (profile.genres[sig.genre] || 0) + w;
      if (sig.region)
        profile.regions[sig.region] = (profile.regions[sig.region] || 0) + w;
    }
    return profile;
  }
  // Fallback: build from local data only (sparse but functional)
  const profile = { energies: {}, moods: {}, genres: {}, regions: {}, decades: {} };
  for (const sig of tasteSignals) {
    if (sig.strength <= 0) continue;
    const w = sig.strength;
    if (sig.energy && sig.energy !== 'unknown') profile.energies[sig.energy] = (profile.energies[sig.energy] || 0) + w;
    if (sig.mood && sig.mood !== 'unknown') profile.moods[sig.mood] = (profile.moods[sig.mood] || 0) + w;
    if (sig.genre && sig.genre !== 'unknown') profile.genres[sig.genre] = (profile.genres[sig.genre] || 0) + w;
    if (sig.region) profile.regions[sig.region] = (profile.regions[sig.region] || 0) + w;
  }
  return profile;
}

// Rotating dimension anchors for tailored mode. Each track uses a DIFFERENT
// anchor dimension, cycling continuously. Anchor weights adapt based on
// user engagement — dimensions that produce saves get boosted, dimensions
// that produce skips decay. Over time the rotation naturally spends more
// time on the dimensions that work for this user.
const ANCHOR_DIMS = ['energy', 'mood', 'genre', 'texture', 'lateral'];
let _anchorIdx = 0;
// Adaptive weights per dimension — start equal, evolve with engagement.
// Higher weight = more likely to be selected as the anchor for the next pick.
let _anchorWeights = { energy: 1.0, mood: 1.0, genre: 1.0, texture: 1.0, lateral: 1.0 };
const ANCHOR_BOOST = 0.3;   // added to weight when a save happens under this anchor
const ANCHOR_DECAY = 0.95;  // all weights multiplied by this each pick (gentle decay toward equal)

function _pickWeightedAnchor() {
  // Weighted random selection from anchor dims based on adaptive weights
  const total = ANCHOR_DIMS.reduce((s, d) => s + _anchorWeights[d], 0);
  let r = Math.random() * total;
  for (const d of ANCHOR_DIMS) {
    r -= _anchorWeights[d];
    if (r <= 0) return d;
  }
  return ANCHOR_DIMS[ANCHOR_DIMS.length - 1];
}

// Called when user saves a track in tailored mode — strong boost
function _boostCurrentAnchor() {
  const dim = ANCHOR_DIMS[_anchorIdx];
  _anchorWeights[dim] += ANCHOR_BOOST;
}

// Adjust anchor weight based on played_pct — continuous signal, not just save/skip
function _adjustAnchorFromPct(pct, action) {
  const dim = ANCHOR_DIMS[_anchorIdx];
  if (pct == null) return;

  if (action === 'listened') {
    // Track ended naturally — boost proportional to how much was heard
    if (pct >= 90) _anchorWeights[dim] += 0.20;      // nearly full listen
    else if (pct >= 70) _anchorWeights[dim] += 0.12;  // deep listen
    else if (pct >= 50) _anchorWeights[dim] += 0.05;  // moderate
  } else if (action === 'skip') {
    // Skip — penalize proportional to how quickly
    if (pct < 5) _anchorWeights[dim] = Math.max(0.3, _anchorWeights[dim] - 0.15);   // instant skip = strong negative
    else if (pct < 15) _anchorWeights[dim] = Math.max(0.3, _anchorWeights[dim] - 0.08);
    else if (pct < 30) _anchorWeights[dim] = Math.max(0.3, _anchorWeights[dim] - 0.03);
    // Skip after 50%+ = mild — they gave it a fair chance
    else if (pct >= 50) _anchorWeights[dim] += 0.02; // slight positive actually
  }
}

// Per-artist AND per-genre AND per-energy pool concentration for inverse weighting
let _artistPoolCount = null;
let _genrePoolCount = null;
let _energyPoolCount = null;
function _getArtistPoolCount() {
  if (_artistPoolCount) return _artistPoolCount;
  _artistPoolCount = {};
  _genrePoolCount = {};
  _energyPoolCount = {};
  for (const t of allTracksPool) {
    const a = (t.artist || '').split(',')[0].trim().toLowerCase();
    if (a) _artistPoolCount[a] = (_artistPoolCount[a] || 0) + 1;
    const g = t._genre || 'unknown';
    _genrePoolCount[g] = (_genrePoolCount[g] || 0) + 1;
    const e = t._energy || 'unknown';
    _energyPoolCount[e] = (_energyPoolCount[e] || 0) + 1;
  }
  return _artistPoolCount;
}
function _getGenrePoolCount() { if (!_genrePoolCount) _getArtistPoolCount(); return _genrePoolCount; }
function _getEnergyPoolCount() { if (!_energyPoolCount) _getArtistPoolCount(); return _energyPoolCount; }

function pickNextTrack() {
  // Full-taste-profile scoring: every candidate is scored against the user's
  // known saves/skips on EVERY dimension at once (genre is the dominant
  // signal, mood secondary, energy/region tertiary). No anchor rotation —
  // the audit showed it ignored the taste profile 80% of the time.
  if (!allTracksPool.length) return null;

  const heardIds = new Set(history.map(h => h.id));
  const available = allTracksPool.filter(t => !heardIds.has(t.id) && !playedIds.has(t.id));
  if (!available.length) {
    // Pool exhausted for this user. Never silently re-suggest — surface that
    // we're out and let the caller handle UX (status message / mode switch).
    return null;
  }

  // Build taste profile from signals (server-loaded + session)
  const rawTaste = _buildTasteProfile();

  // Normalize each dimension to [-1, 1] by its own max|value|. Without this,
  // raw save-counts make energy (5 buckets) swamp genre (100+ buckets): the
  // top energy bucket can sit at ~1600 while the top genre bucket is ~33.
  // After normalization every dim contributes ≤ its configured weight.
  function _normDim(d) {
    if (!d) return {};
    let mx = 0;
    for (const k in d) { const a = Math.abs(d[k]); if (a > mx) mx = a; }
    if (!mx) return {};
    const out = {};
    for (const k in d) out[k] = d[k] / mx;
    return out;
  }
  const taste = {
    genres: _normDim(rawTaste.genres),
    moods: _normDim(rawTaste.moods),
    energies: _normDim(rawTaste.energies),
    regions: _normDim(rawTaste.regions),
  };

  // Set of the user's positively-weighted top genres — tracks completely
  // outside this cluster get a small "genre alignment gate" penalty so we
  // stop wandering into yodeling/turbo-folk/zamba territory.
  const topGenreSet = new Set(
    Object.entries(rawTaste.genres || {})
      .filter(([,w]) => w > 0)
      .sort((a,b) => b[1] - a[1])
      .slice(0, 30)
      .map(([g]) => g)
  );

  // Recent tracks for short-horizon diversity (avoid back-to-back repeats)
  const recentWindow = 10;
  const recent = [];
  for (let i = Math.max(0, dIdx - recentWindow); i < dIdx && i < allDiscovery.length; i++) {
    recent.push(allDiscovery[i]);
  }
  const recentRegions = new Set(recent.map(t => t.region));
  const recentGenres = new Set(recent.map(t => t._genre));

  // Energy diversity: count energy levels in recent picks. Under-represented
  // levels get a boost, over-represented ones get docked. User wants variety
  // on the energy axis even though their saves skew moderate — so energy is
  // *not* a taste-matching dimension, it's an exploration dimension.
  const recentEnergyCounts = {};
  for (const r of recent) {
    const e = r._energy || 'unknown';
    recentEnergyCounts[e] = (recentEnergyCounts[e] || 0) + 1;
  }
  const recentTotal = Math.max(1, recent.length);

  const apc = _getArtistPoolCount();
  const gpc = _getGenrePoolCount();

  const sampleSize = Math.min(400, available.length);
  const candidates = available.length <= sampleSize
    ? available
    : available.sort(() => Math.random() - 0.5).slice(0, sampleSize);

  let bestScore = -Infinity, bestTrack = candidates[0];
  let bestBreakdown = null;

  for (const t of candidates) {
    // Primary taste match: genre is the single most discriminating signal
    // for this user — score aggressively from it.
    const primaryGenre = t._genre || 'unknown';
    let genreScore = (taste.genres[primaryGenre] || 0) * 4;

    // Secondary genres (track.genres[1..2]) — Spotify often tags multiple
    const extraGenres = (t.genres || []).slice(1, 3);
    for (const g of extraGenres) {
      const gl = (g || '').toLowerCase();
      if (gl) genreScore += (taste.genres[gl] || 0) * 1.5;
    }

    // Lateral genre boost via GENRE_MAP.neighbors (soft similarity).
    // Chillwave → dream pop etc. Only activates when the map is loaded.
    if (GENRE_MAP && GENRE_MAP.neighbors) {
      // Check user's top 5 genres for neighbor-of-a-favorite match
      const topGenres = Object.entries(taste.genres)
        .filter(([,w]) => w > 0)
        .sort((a,b) => b[1] - a[1])
        .slice(0, 5);
      for (const [sg, w] of topGenres) {
        const neigh = GENRE_MAP.neighbors[sg];
        if (!neigh) continue;
        const idx = neigh.indexOf(primaryGenre);
        if (idx >= 0 && idx < 10) {
          genreScore += w * (1 - idx * 0.08);  // 1.0 → 0.2 for 10 neighbors
        }
      }
    }

    const moodScore = (taste.moods[t._mood] || 0) * 2;
    const regionScore = (taste.regions[t.region] || 0) * 0.5;

    // Energy = inverse-frequency exploration bonus. Under-represented energy
    // in the last ~10 picks gets up to +2; over-represented up to −2. No
    // taste bias toward user's saved-energy distribution (user explicitly
    // wants full energy spectrum regardless of what they save).
    const myEnergy = t._energy || 'unknown';
    const share = (recentEnergyCounts[myEnergy] || 0) / recentTotal;
    const energyScore = (0.4 - share) * 5;  // share=0 → +2; share=0.8 → −2

    let score = genreScore + moodScore + energyScore + regionScore;

    // Genre alignment gate — if primary genre is outside the user's top-30
    // saved genres AND no lateral neighbor match, dock the score. Soft, not
    // a hard filter: a great mood+energy match can still surface something
    // surprising, but zamba/yodeling shouldn't be beating chillwave.
    const inCluster = topGenreSet.has(primaryGenre) || extraGenres.some(g => topGenreSet.has((g||'').toLowerCase()));
    if (!inCluster && genreScore < 0.3) score -= 3;

    // Penalty for unknown/missing labels — these tracks had bad/no metadata
    // and can't meaningfully match the user's taste profile.
    if (!t._mood || t._mood === 'unknown') score -= 4;
    if (!t._energy || t._energy === 'unknown') score -= 4;
    if (primaryGenre === 'unknown') score -= 6;

    // Short-horizon diversity (prevent back-to-back same region/genre)
    if (recentRegions.has(t.region)) score -= 2;
    if (recentGenres.has(primaryGenre)) score -= 3;

    // Quality signal from engagement history (saved/deep-listened boost,
    // skipped/disliked penalty). Small coefficient — dominant signal is taste.
    const quality = t._quality || 0;
    if (quality > 0) score += Math.min(quality, 10) * 0.5;
    else if (quality < 0) score += Math.max(quality, -10) * 0.3;

    // Anti-concentration: dampen over-represented artists/genres
    const primaryArtist = (t.artist || '').split(',')[0].trim().toLowerCase();
    const artistConc = apc[primaryArtist] || 1;
    const genreConc = gpc[primaryGenre] || 1;
    score *= (1 / Math.sqrt(artistConc)) * (1 / Math.pow(genreConc, 0.2));

    // Small random nudge for tiebreaking (and to surface variety when
    // many tracks tie near the top)
    score += Math.random() * 0.5;

    if (score > bestScore) {
      bestScore = score;
      bestTrack = t;
      bestBreakdown = {
        genre: Math.round(genreScore * 10) / 10,
        mood: Math.round(moodScore * 10) / 10,
        energy: Math.round(energyScore * 10) / 10,
        region: Math.round(regionScore * 10) / 10,
      };
    }
  }

  playedIds.add(bestTrack.id);
  if (typeof clientLog === 'function') {
    clientLog('tailored', 'pick', {
      artist: (bestTrack.artist || '').slice(0, 30),
      track: (bestTrack.name || '').slice(0, 30),
      energy: bestTrack._energy,
      mood: bestTrack._mood,
      region: bestTrack.region,
      genre: bestTrack._genre,
      score: Math.round(bestScore * 10) / 10,
      parts: bestBreakdown,
    });
  }
  return bestTrack;
}

// Session tracking
let history = []; // { track, artist, id, region, status: 'listened'|'skipped'|'saved', time }

async function loadHistory() {
  // Try server first, fall back to localStorage
  try {
    const res = await fetch('/history');
    const data = await res.json();
    if (Array.isArray(data) && data.length > 0) {
      history = data;
      localStorage.setItem('dig-history', JSON.stringify(history));
      return;
    }
  } catch(e) {}
  try { history = JSON.parse(localStorage.getItem('dig-history') || '[]'); } catch(e) { history = []; }
}
function saveHistory() {
  localStorage.setItem('dig-history', JSON.stringify(history));
  // Persist to server (fire and forget, debounced)
  clearTimeout(saveHistory._timer);
  saveHistory._timer = setTimeout(() => {
    fetch('/history', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(history),
    }).catch(() => {});
  }, 2000);
}
// Mode the track was played in — matches the values sent to clientLog/mode on
// next-track calls. "discovery" is the default exploration mode (no toggles).
function currentMode() {
  if (journeyMode) return 'journey';
  if (aiMixMode) return 'aimix';
  if (tailoredMode) return 'tailored';
  return 'discovery';
}

function addToHistory(track, status, pct) {
  // pct: 0–100 played percentage at the moment this status was set.
  // Captured so future taste signals can weight by listen completeness.
  const playedPct = (pct == null && typeof getPlayedPct === 'function') ? getPlayedPct() : pct;
  const mode = currentMode();
  const existing = history.find(h => h.id === track.id);
  if (existing) {
    existing.status = status;
    existing.time = Date.now();
    if (playedPct != null) existing.played_pct = playedPct;
    // Only stamp mode on first insert — preserve the mode the track was
    // originally surfaced in, even if the user later saves/dislikes it from
    // a different mode.
    if (existing.mode == null) existing.mode = mode;
  } else {
    history.unshift({
      track: track.name, artist: track.artist, id: track.id,
      region: track.region || '', status, time: Date.now(),
      played_pct: playedPct, mode,
    });
  }
  saveHistory();
  // Also save to server ledger
  fetch(`/listened?track=${encodeURIComponent(track.artist + ' - ' + track.name)}`).catch(() => {});
  renderFeed();
  renderMap();
}

// ===== HEART ANIMATION =====
function triggerOverlay(id) {
  const el = document.getElementById(id);
  if (!el) return;
  el.classList.remove('pop');
  void el.offsetWidth;
  el.classList.add('pop');
  setTimeout(() => el.classList.remove('pop'), 800);
}

// ===== UNIFIED PLAYER =====
// Wraps Spotify + YouTube (+ future sources) behind one interface.
// The rest of the app only talks to `Player`.
// YouTube: disabled — no IFrame API load, no yt: playback (pool filtered server-side too).
const DIG_USE_YOUTUBE = false;

const Player = (() => {
  let activeSource = null;   // 'spotify' | 'youtube'
  let _onTrackEnd = null;
  let _onStateChange = null;

  // ── Spotify backend ──
  const spotify = {
    player: null, deviceId: null, token: null, ready: false, _lastArtUrl: null,

    async init() {
      const status = document.getElementById('player-status');
      status.textContent = '...';
      try {
        const res = await fetch('/token');
        const data = await res.json();
        if (data.error) {
          if (data.auth_url) {
            status.textContent = 'login →';
            status.style.cursor = 'pointer';
            status.onclick = () => { window.location.href = '/login'; };
          } else {
            status.textContent = '';
          }
          return;
        }
        spotify.token = data.access_token;
      } catch(e) { status.textContent = '!'; return; }

      spotify.player = new Spotify.Player({
        name: 'DIG',
        getOAuthToken: async cb => {
          try {
            const r = await fetch('/token');
            const d = await r.json();
            if (d.access_token) { spotify.token = d.access_token; cb(spotify.token); }
            else if (d.auth_url) { window.location.href = '/login'; }
            else { cb(spotify.token); }
          } catch(e) { cb(spotify.token); }
        },
        volume: 0.8,
      });

      spotify.player.addListener('ready', ({ device_id }) => {
        spotify.deviceId = device_id;
        spotify.ready = true;
        status.textContent = 'ready';
        console.log('Spotify ready, device:', device_id);
        if (typeof clientLog === 'function') clientLog('firstplay', 'Spotify SDK ready event fired', { device_id });
        setTimeout(() => { status.textContent = ''; }, 3000);
        // If the user pressed play before the SDK was ready, fire it now.
        if (typeof _tryConsumePendingPlay === 'function') _tryConsumePendingPlay('sdk-ready');
      });
      spotify.player.addListener('not_ready', () => {
        status.textContent = 'offline';
        if (typeof clientLog === 'function') clientLog('spotify', 'SDK not_ready event');
      });
      spotify.player.addListener('initialization_error', ({ message }) => {
        status.textContent = 'init err';
        if (typeof clientLog === 'function') clientLog('spotify', 'initialization_error', { message });
        console.error(message);
      });
      spotify.player.addListener('account_error', ({ message }) => {
        status.textContent = 'need Premium';
        if (typeof clientLog === 'function') clientLog('spotify', 'account_error', { message });
        console.error(message);
      });
      spotify.player.addListener('playback_error', ({ message }) => {
        console.error('Spotify playback error:', message);
      });

      spotify.player.addListener('player_state_changed', state => {
        if (!state) return;
        if (activeSource !== 'spotify') return;
        const pos = state.position, dur = state.duration;
        document.getElementById('btn-play').textContent = state.paused ? '▶' : '❚❚';
        document.getElementById('mc-play').textContent = state.paused ? '▶' : '❚❚';
        if (!state.paused) { Player._clearStuckTimer(); const s = document.getElementById('player-status'); if (s && !s.textContent.includes('tailored')) s.textContent = ''; }
        _updateProgress(pos, dur);
        void syncMediaSessionPlayback();
        // Album art — only update DOM if the URL actually changed
        const images = state.track_window?.current_track?.album?.images;
        if (images && images.length > 0) {
          const url = images[0].url;
          if (url !== spotify._lastArtUrl) {
            spotify._lastArtUrl = url;
            document.getElementById('player-art').innerHTML = `<img src="${url}">`;
            const ba = document.getElementById('big-art');
            ba.innerHTML = `<img src="${url}"><div class="art-overlay heart" id="heart-overlay">♥</div><div class="art-overlay nah" id="nah-overlay">✕</div>`;
            ba.classList.add('has-art');
            if ('mediaSession' in navigator && navigator.mediaSession.metadata) {
              navigator.mediaSession.metadata.artwork = [{ src: url, sizes: '300x300', type: 'image/jpeg' }];
            }
          }
        }
        // Track ended — but guard against the Spotify SDK's known false-positive:
        // during track transitions, the SDK briefly fires state_changed with
        // paused=true, position=0, previous_tracks populated BEFORE the new
        // track's audio buffer starts. Without a cooldown this cascades into
        // rapid auto-skipping (3+ tracks "ending" within 100ms).
        if (state.paused && state.position === 0 && state.track_window.previous_tracks.length > 0) {
          const msSincePlay = Date.now() - (Player._lastPlayStarted || 0);
          if (msSincePlay > 2000) {
            // Genuine track end — the track played for at least 2s before reporting ended
            if (_onTrackEnd) _onTrackEnd();
          } else {
            // Spurious — within 2s of the last play() call. Ignore silently.
            console.log(`[DIG] ignoring spurious "track ended" ${msSincePlay}ms after play()`);
          }
        }
      });

      spotify.player.addListener('authentication_error', () => {
        status.textContent = 'auth err';
        setTimeout(() => spotify.init(), 3000);
      });

      await spotify.player.connect();
    },

    async play(trackId) {
      if (!spotify.deviceId || !spotify.token) {
        console.warn('[DIG] spotify.play: no deviceId or token', { deviceId: spotify.deviceId, hasToken: !!spotify.token });
        return false;
      }
      youtube.stop();
      activeSource = 'spotify';
      spotify._lastArtUrl = null;
      try {
        // Optimistic path: try the play with our cached token first. Only on a
        // 401 do we refresh and retry. Spotify access tokens are valid 60min,
        // so on the warm path this saves a 200–400ms /token round-trip per skip.
        let resp = await fetch(`https://api.spotify.com/v1/me/player/play?device_id=${spotify.deviceId}`, {
          method: 'PUT',
          headers: { 'Authorization': `Bearer ${spotify.token}`, 'Content-Type': 'application/json' },
          body: JSON.stringify({ uris: [`spotify:track:${trackId}`] }),
        });
        if (resp.status === 401) {
          // Token expired — refresh and retry once
          try {
            const tr = await fetch('/token');
            const td = await tr.json();
            if (td.access_token) {
              spotify.token = td.access_token;
              resp = await fetch(`https://api.spotify.com/v1/me/player/play?device_id=${spotify.deviceId}`, {
                method: 'PUT',
                headers: { 'Authorization': `Bearer ${spotify.token}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ uris: [`spotify:track:${trackId}`] }),
              });
            } else if (td.auth_url) {
              window.location.href = '/login';
              return false;
            }
          } catch (e) { /* fall through to error handling below */ }
        }
        if (!resp.ok) {
          if (resp.status === 401) {
            console.warn('[DIG] Spotify token expired even after refresh — redirecting to login');
            window.location.href = '/login';
            return false;
          }
          console.error(`[DIG] spotify.play FAILED: ${resp.status}`);
          return false;
        }
        document.getElementById('btn-play').textContent = '❚❚'; document.getElementById('mc-play').textContent = '❚❚';
        _startPoll();
        return true;
      } catch (err) {
        console.error('[DIG] spotify.play fetch error:', err);
        return false;
      }
    },

    async togglePlay() { if (spotify.player) await spotify.player.togglePlay(); },
    async pause() { if (spotify.player) await spotify.player.pause(); },
    async resume() { if (spotify.player) await spotify.player.resume(); },

    async seek(posMs) { if (spotify.player) await spotify.player.seek(posMs); },

    async getState() {
      if (!spotify.player) return null;
      const s = await spotify.player.getCurrentState();
      if (!s) return null;
      return { position: s.position, duration: s.duration, paused: s.paused };
    },

    stop() {
      if (spotify.player) spotify.player.pause().catch(() => {});
    },
  };

  // ── YouTube backend ──
  const youtube = {
    player: null, ready: false, _apiLoaded: false, _duration: 0,

    init() {
      if (youtube._apiLoaded) return;
      youtube._apiLoaded = true;
      const tag = document.createElement('script');
      tag.src = 'https://www.youtube.com/iframe_api';
      document.head.appendChild(tag);
      window.onYouTubeIframeAPIReady = () => {
        youtube.player = new YT.Player('yt-host', {
          width: '1', height: '1',
          playerVars: {
            autoplay: 0, controls: 0, disablekb: 1, fs: 0, modestbranding: 1,
            origin: window.location.origin,
          },
          events: {
            onReady: () => { youtube.ready = true; console.log('YouTube player ready'); },
            onStateChange: (e) => {
              if (activeSource !== 'youtube') return;
              if (e.data === YT.PlayerState.ENDED) {
                if (_onTrackEnd) _onTrackEnd();
              }
              if (e.data === YT.PlayerState.PLAYING) {
                Player._clearStuckTimer();
                youtube._duration = youtube.player.getDuration() * 1000;
                document.getElementById('btn-play').textContent = '❚❚'; document.getElementById('mc-play').textContent = '❚❚';
              }
              if (e.data === YT.PlayerState.PAUSED) {
                document.getElementById('btn-play').textContent = '▶'; document.getElementById('mc-play').textContent = '▶';
              }
              // OS / AirPods use Media Session on the *page*; YT audio is in an iframe, so we must
              // publish playbackState + position here or hardware controls stay bound to nothing useful.
              void syncMediaSessionPlayback();
            },
            onError: (e) => {
              console.error('YT error:', e.data);
              // Skip to next on error (video unavailable, etc.)
              if (_onTrackEnd) _onTrackEnd();
            },
          },
        });
      };
    },

    play(videoId, thumb) {
      dbg(`yt.play: id=${videoId}, player=${!!youtube.player}, ready=${youtube.ready}`);
      if (!youtube.player || !youtube.ready) { dbg('yt not ready, aborting'); return false; }
      if (!videoId) { console.warn('[DIG] yt.play: no videoId'); return false; }
      spotify.stop(); // make sure Spotify is silent
      activeSource = 'youtube';
      youtube.player.loadVideoById(videoId);
      youtube._duration = 0;
      document.getElementById('btn-play').textContent = '❚❚'; document.getElementById('mc-play').textContent = '❚❚';
      // Set thumbnail
      if (thumb) {
        document.getElementById('player-art').innerHTML = `<img src="${thumb}">`;
        document.getElementById('big-art').innerHTML = `<img src="${thumb}"><div class="art-overlay heart" id="heart-overlay">♥</div><div class="art-overlay nah" id="nah-overlay">✕</div>`;
      } else {
        const thumbUrl = `https://img.youtube.com/vi/${videoId}/mqdefault.jpg`;
        document.getElementById('player-art').innerHTML = `<img src="${thumbUrl}">`;
        document.getElementById('big-art').innerHTML = `<img src="${thumbUrl}"><div class="art-overlay heart" id="heart-overlay">♥</div><div class="art-overlay nah" id="nah-overlay">✕</div>`;
      }
      _startPoll();
      return true;
    },

    togglePlay() {
      if (!youtube.player) return;
      const state = youtube.player.getPlayerState();
      if (state === YT.PlayerState.PLAYING) youtube.player.pauseVideo();
      else youtube.player.playVideo();
    },

    seek(posMs) {
      if (youtube.player) youtube.player.seekTo(posMs / 1000, true);
    },

    getState() {
      if (!youtube.player || !youtube.ready) return null;
      const state = youtube.player.getPlayerState();
      if (state === -1) return null; // unstarted
      return {
        position: youtube.player.getCurrentTime() * 1000,
        duration: youtube._duration || (youtube.player.getDuration() * 1000),
        paused: state === YT.PlayerState.PAUSED || state === YT.PlayerState.ENDED,
      };
    },

    stop() {
      if (youtube.player && youtube.ready) {
        try { youtube.player.stopVideo(); } catch(e) {}
      }
    },
  };

  // ── Shared helpers ──
  let _pollInterval = null;
  let _lastPos = 0, _lastDur = 0;     // latest polled position/duration (ms)
  let _prevPos = 0;                   // previous poll's position (for forward-progress detection)
  let _listenedMs = 0;                // accumulator: real ms the user actually listened
  let _currentTrackForListen = null;  // track id this accumulator belongs to

  function _resetListenAccumulator(trackId) {
    _listenedMs = 0;
    _prevPos = 0;
    _currentTrackForListen = trackId;
  }
  // Public so playCurrentTrack can call it on new track start
  window._resetListenAccumulator = _resetListenAccumulator;

  function _updateProgress(posMs, durMs) {
    if (!durMs) return;
    _lastPos = posMs; _lastDur = durMs;
    // Accumulate real listening time: only count if position advanced 100ms–2000ms
    // (a normal poll interval). Big jumps = user seeking; rewind = also a seek.
    const delta = posMs - _prevPos;
    if (delta > 50 && delta < 2000) {
      _listenedMs += delta;
    }
    _prevPos = posMs;
    document.getElementById('player-progress-fill').style.width = ((posMs / durMs) * 100) + '%';
    document.getElementById('player-time').textContent = _msToTime(posMs);
  }

  // Returns 0–100 = (real seconds listened / track length) — robust against seeking.
  window.getPlayedPct = function () {
    if (!_lastDur) return null;
    return Math.min(100, Math.max(0, (_listenedMs / _lastDur) * 100));
  };
  // Diagnostic — useful for the firstplay/skip telemetry
  window.getListenedMs = function () { return _listenedMs; };

  function _msToTime(ms) {
    const s = Math.floor(ms / 1000);
    return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  }

  function _startPoll() {
    if (_pollInterval) clearInterval(_pollInterval);
    _pollInterval = setInterval(async () => {
      const state = await Player.getState();
      if (state) _updateProgress(state.position, state.duration);
      void syncMediaSessionPlayback();
    }, 500);
  }

  /** Keep lock screen / AirPods / Control Center in sync (critical for YouTube-in-iframe). */
  async function syncMediaSessionPlayback() {
    if (!('mediaSession' in navigator)) return;
    if (!activeSource) {
      try { navigator.mediaSession.playbackState = 'none'; } catch (e) {}
      return;
    }
    const st = activeSource === 'youtube' ? youtube.getState() : await spotify.getState();
    if (!st) {
      try { navigator.mediaSession.playbackState = 'none'; } catch (e) {}
      return;
    }
    try {
      navigator.mediaSession.playbackState = st.paused ? 'paused' : 'playing';
    } catch (e) {}
    if (!navigator.mediaSession.setPositionState) return;
    const durSec = st.duration / 1000;
    if (!durSec || durSec <= 0 || !isFinite(durSec)) return;
    let pos = st.position / 1000;
    pos = Math.min(Math.max(pos, 0), Math.max(durSec - 0.05, 0));
    try {
      navigator.mediaSession.setPositionState({
        duration: durSec,
        playbackRate: st.paused ? 0 : 1,
        position: pos,
      });
    } catch (e) {
      try {
        navigator.mediaSession.setPositionState({
          duration: durSec,
          playbackRate: 1,
          position: pos,
        });
      } catch (e2) {
        try { navigator.mediaSession.setPositionState(null); } catch (e3) {}
      }
    }
  }

  // ── Public API ──
  return {
    async init() {
      if (DIG_USE_YOUTUBE) youtube.init();
      await spotify.init();
    },

    onTrackEnd(fn) { _onTrackEnd = fn; },

    isReady() {
      return spotify.ready || (DIG_USE_YOUTUBE && youtube.ready);
    },
    isSpotifyReady() { return spotify.ready; },
    isPlaying() { return this._playing; },

    get spotifyReady() { return spotify.ready; },
    get spotifyDeviceId() { return spotify.deviceId; },

    _playing: false,
    _stuckTimer: null,

    _clearStuckTimer() {
      if (this._stuckTimer) { clearTimeout(this._stuckTimer); this._stuckTimer = null; }
    },

    _startStuckTimer(track) {
      this._clearStuckTimer();
      this._stuckTimer = setTimeout(async () => {
        // Check if anything is actually playing
        const state = await Player.getState();
        if (!state || state.paused) {
          console.warn(`[DIG] STUCK detected: "${track.artist} - ${track.name}" [${track.source||'spotify'}] id=${track.id} — no playback after 8s, auto-skipping`);
          if (_onTrackEnd) _onTrackEnd();
        }
      }, 8000);
    },

    async play(track) {
      this._clearStuckTimer();
      // Guard against concurrent playback calls
      if (this._playing) {
        spotify.stop();
        youtube.stop();
        await new Promise(r => setTimeout(r, 100));
      }
      this._playing = true;
      this._lastPlayStarted = Date.now();
      try {
        const source = track.source || 'spotify';
        if (!DIG_USE_YOUTUBE && (source === 'youtube' || String(track.id || '').startsWith('yt:'))) {
          console.warn('[DIG] YouTube playback disabled, skipping');
          return false;
        }
        let trackId = source === 'youtube' ? (track.youtube_id || track.id) : track.id;
        if (source === 'youtube' && trackId.startsWith('yt:')) trackId = trackId.slice(3);
        console.log(`[DIG] Player.play: "${track.artist} - ${track.name}" source=${source} id=${trackId}`);

        if (source === 'youtube') {
          const ok = youtube.play(trackId, track.thumbnail);
          if (!ok) {
            console.warn(`[DIG] YouTube play returned false for "${track.name}"`);
            return false;
          }
          this._startStuckTimer(track);
          return true;
        } else {
          if (!spotify.ready) {
            console.warn(`[DIG] Spotify not ready, cannot play "${track.name}"`);
            return false;
          }
          const ok = await spotify.play(trackId);
          if (!ok) {
            console.warn(`[DIG] Spotify play returned false for "${track.name}" id=${trackId}`);
            return false;
          }
          this._startStuckTimer(track);
          return true;
        }
      } finally {
        this._playing = false;
      }
    },

    async togglePlay() {
      if (activeSource === 'youtube') youtube.togglePlay();
      else await spotify.togglePlay();
    },

    async pause() {
      if (activeSource === 'youtube') youtube.togglePlay(); // YouTube has no separate pause
      else await spotify.pause();
    },

    async resume() {
      if (activeSource === 'youtube') youtube.togglePlay();
      else await spotify.resume();
    },

    async seekRelative(ms) {
      const state = await this.getState();
      if (!state) {
        console.warn('[DIG playback] seekRelative: no state', { ms, activeSource });
        return;
      }
      const dur = state.duration;
      if (!dur || dur < 1000 || !isFinite(dur)) {
        // Spotify SDK often reports duration: 0 briefly after a track change; seeking then clamps to 0 → "restart".
        console.warn('[DIG playback] seekRelative: skipped (no duration yet)', { ms, dur, pos: state.position });
        return;
      }
      const target = Math.max(0, Math.min(dur, state.position + ms));
      console.log('[DIG playback] seekRelative', { ms, from: state.position, to: target, dur });
      if (activeSource === 'youtube') youtube.seek(target);
      else await spotify.seek(target);
    },

    async seekTo(posMs) {
      const state = await this.getState();
      if (!state) return;
      const dur = state.duration;
      if (!dur || dur < 1000 || !isFinite(dur)) {
        console.warn('[DIG playback] seekTo: skipped (no duration yet)', { posMs, dur });
        return;
      }
      const clamped = Math.max(0, Math.min(dur, posMs));
      console.log('[DIG playback] seekTo', { posMs: clamped, dur });
      if (activeSource === 'youtube') youtube.seek(clamped);
      else await spotify.seek(clamped);
    },

    async getState() {
      if (activeSource === 'youtube') return youtube.getState();
      return await spotify.getState();
    },

    get activeSource() { return activeSource; },

    syncMediaSession: () => syncMediaSessionPlayback(),
  };
})();

// ── iOS detection: Spotify Web Playback SDK doesn't work on iOS (WebKit limitation).
// On iOS we use Spotify Connect via server-side REST API instead.
const DIG_IS_IOS = /iPhone|iPad|iPod/.test(navigator.userAgent) && !window.MSStream;

if (DIG_IS_IOS) {
  console.log('[DIG] iOS detected — using Spotify Connect mode (server-side REST API)');

  // Override Player methods to route through server API instead of SDK
  const _origInit = Player.init.bind(Player);
  const _origPlay = Player.play.bind(Player);

  // Track state for the Connect player
  let _connectPlaying = false;
  let _connectTrackId = null;
  let _connectPollInterval = null;

  Player.init = async function() {
    // On iOS, don't init the SDK. Instead, check if user is authenticated
    // and if Spotify app has an active device.
    const status = document.getElementById('player-status');
    try {
      const res = await fetch('/token');
      const data = await res.json();
      if (data.error) {
        if (data.auth_url) {
          status.textContent = 'login →';
          status.style.cursor = 'pointer';
          status.onclick = () => { window.location.href = '/login'; };
        }
        return;
      }
      // On iOS we DON'T pick a specific device. We let Spotify route the
      // play command to whatever device was last active (usually the phone's
      // Spotify app). Specifying a device_id was causing DIG to target the
      // laptop's SDK instead of the phone.
      Player._connectReady = true;
      Player._connectDeviceId = null; // null = let Spotify decide
      Player._connectDeviceName = 'Spotify';
      status.textContent = '';
      if (typeof clientLog === 'function') clientLog('connect', 'ready (no device pinned — Spotify decides routing)');
      if (typeof _tryConsumePendingPlay === 'function') _tryConsumePendingPlay('connect-ready');
    } catch (e) {
      if (typeof clientLog === 'function') clientLog('connect', 'init failed', { err: String(e) });
      status.textContent = 'error';
    }
  };

  Player.isReady = function() { return !!Player._connectReady; };
  Player.isSpotifyReady = function() { return !!Player._connectReady; };
  Object.defineProperty(Player, 'spotifyReady', { get() { return !!Player._connectReady; } });

  Player.play = async function(track) {
    Player._playing = true;
    Player._lastPlayStarted = Date.now();
    const trackId = track.id || track;
    if (typeof clientLog === 'function') clientLog('connect', 'play', { id: trackId, device: Player._connectDeviceId });

    async function _tryPlay(deviceId) {
      const url = `/api/play?track=${encodeURIComponent(trackId)}` +
                  (deviceId ? `&device=${encodeURIComponent(deviceId)}` : '');
      const r = await fetch(url);
      return await r.json();
    }

    try {
      let data = await _tryPlay(Player._connectDeviceId);

      // If play failed, retry once without device_id (let Spotify route)
      if (data.error && /spotify_(404|502|500)/.test(data.error)) {
        if (typeof clientLog === 'function') clientLog('connect', 'play failed, retrying without device', { err: data.error });
        data = await _tryPlay(null);
      }

      if (data.error) {
        console.warn('[DIG connect] play error after retry:', data);
        if (typeof clientLog === 'function') clientLog('connect', 'all play attempts failed — launching Spotify deep link', { err: data.error, trackId });
        // Last resort: open the track directly in the Spotify app via deep link.
        // This wakes up the Spotify app and starts playback natively.
        // After a few seconds the device becomes active and subsequent
        // DIG play/skip commands work via the REST API.
        window.location.href = `spotify:track:${trackId}`;
        Player._playing = false;
        // After launching Spotify, wait then re-init Connect so the
        // now-active device is found for future commands.
        setTimeout(async () => {
          Player._connectReady = true;
          _connectPlaying = true;
          _connectTrackId = trackId;
          _startConnectPoll();
          if (typeof clientLog === 'function') clientLog('connect', 'post-deep-link re-init');
        }, 3000);
        return true; // treat as success since Spotify app will play it
      }
      _connectPlaying = true;
      _connectTrackId = trackId;
      _startConnectPoll();
      // Pre-queue the next few tracks into Spotify's native queue so
      // AirPods double-tap (skip) advances through DIG's tracks, not
      // Spotify's own queue. This is the key to making iOS playback
      // feel native — Spotify handles skip internally.
      void _prequeueNextTracks();
      return true;
    } catch (e) {
      console.error('[DIG connect] play threw:', e);
      Player._playing = false;
      return false;
    }
  };

  // ── Spotify queue pre-loading ───────────────────────────────────────────
  // Only pre-queue 1 track at a time into Spotify's native queue.
  // More than 1 causes staleness: AirPods skip plays the OLDEST queued
  // item (FIFO), which may be from a completely different queue position
  // if the user has been skipping via the UI in between.
  let _lastQueuedId = null;       // the one track sitting in Spotify's queue
  let _prequeueInFlight = false;

  async function _prequeueNextTracks() {
    if (_prequeueInFlight || !DIG_IS_IOS) return;
    _prequeueInFlight = true;
    try {
      // Find the very next unheard track after current position
      const heardIds = new Set(history.map(h => h.id));
      for (let i = dIdx + 1; i < allDiscovery.length; i++) {
        const t = allDiscovery[i];
        if (!t || !t.id) continue;
        if (heardIds.has(t.id)) continue;
        if (t.id === _lastQueuedId) return; // already queued this one
        // Push to Spotify's native queue
        try {
          const r = await fetch(`/api/queue?track=${encodeURIComponent(t.id)}`);
          const data = await r.json();
          if (data.ok) {
            _lastQueuedId = t.id;
            console.log(`[DIG connect] queued next: ${t.artist} — ${t.name}`);
            if (typeof clientLog === 'function') clientLog('connect', 'queued next track', { id: t.id, name: t.name });
          }
        } catch (e) {}
        return; // only queue 1
      }
    } finally {
      _prequeueInFlight = false;
    }
  }

  Player.togglePlay = async function() {
    const d = Player._connectDeviceId ? `?device=${encodeURIComponent(Player._connectDeviceId)}` : '';
    if (_connectPlaying) {
      try { await fetch('/api/pause' + d); _connectPlaying = false; } catch(e) {}
    } else {
      try { await fetch('/api/resume' + d); _connectPlaying = true; } catch(e) {}
    }
  };

  Player.pause = async function() {
    const d = Player._connectDeviceId ? `?device=${encodeURIComponent(Player._connectDeviceId)}` : '';
    try { await fetch('/api/pause' + d); _connectPlaying = false; } catch(e) {}
  };

  Player.resume = async function() {
    const d = Player._connectDeviceId ? `?device=${encodeURIComponent(Player._connectDeviceId)}` : '';
    try { await fetch('/api/resume' + d); _connectPlaying = true; } catch(e) {}
  };

  Player.getState = async function() {
    // Poll Spotify's player state via token — includes album art for iOS
    try {
      const tk = await fetch('/token').then(r => r.json());
      if (!tk.access_token) return null;
      const r = await fetch('https://api.spotify.com/v1/me/player', {
        headers: { 'Authorization': 'Bearer ' + tk.access_token },
      });
      if (r.status === 204 || !r.ok) return null;
      const s = await r.json();
      return {
        position: s.progress_ms || 0,
        duration: s.item?.duration_ms || 0,
        paused: !s.is_playing,
        trackId: s.item?.id || null,
        albumArt: s.item?.album?.images?.[0]?.url || null,
        trackName: s.item?.name || null,
        artistName: (s.item?.artists || []).map(a => a.name).join(', ') || null,
      };
    } catch (e) { return null; }
  };

  Player.seekRelative = async function(ms) {
    try {
      const st = await Player.getState();
      if (!st) return;
      const target = Math.max(0, st.position + ms);
      const tk = await fetch('/token').then(r => r.json());
      if (!tk.access_token) return;
      await fetch(`https://api.spotify.com/v1/me/player/seek?position_ms=${target}`, {
        method: 'PUT',
        headers: { 'Authorization': 'Bearer ' + tk.access_token },
      });
    } catch (e) {}
  };

  let _connectLastArt = null;

  let _connectPollFailures = 0;

  function _startConnectPoll() {
    if (_connectPollInterval) clearInterval(_connectPollInterval);
    _connectPollInterval = setInterval(async () => {
      const st = await Player.getState();
      if (!st) {
        _connectPollFailures++;
        // If we expected to be playing but Spotify returns no state for 5+ polls,
        // the playback silently died. Log it so we can detect this pattern.
        if (_connectPlaying && _connectPollFailures >= 4) {
          if (typeof clientLog === 'function') clientLog('connect', 'playback appears dead — Spotify returns no state', { failures: _connectPollFailures, trackId: _connectTrackId });
          _connectPlaying = false;
          const s = document.getElementById('player-status') || document.getElementById('pc-region');
          if (s) s.textContent = 'playback lost — tap play';
        }
        return;
      }
      _connectPollFailures = 0;
      // Update progress bar
      if (st.duration) {
        document.getElementById('player-progress-fill').style.width = ((st.position / st.duration) * 100) + '%';
      }
      // Update play/pause button
      const btn = document.getElementById('mc-play') || document.getElementById('btn-play');
      if (btn) btn.textContent = st.paused ? '▶' : '❚❚';
      _connectPlaying = !st.paused;
      // Album art + track info — update from what Spotify is ACTUALLY playing.
      // This corrects stale title/artist when the real track differs from
      // what DIG's pool data said (e.g., Spotify auto-advanced, or the play
      // targeted a different version).
      if (st.albumArt && st.albumArt !== _connectLastArt) {
        _connectLastArt = st.albumArt;
        document.getElementById('player-art').innerHTML = `<img src="${st.albumArt}">`;
        const ba = document.getElementById('big-art');
        if (ba) {
          ba.innerHTML = `<img src="${st.albumArt}"><div class="art-overlay heart" id="heart-overlay">♥</div><div class="art-overlay nah" id="nah-overlay">✕</div>`;
          ba.classList.add('has-art');
        }
      }
      if (st.trackName) {
        document.getElementById('player-track').textContent = st.trackName;
        document.getElementById('pc-track').textContent = st.trackName;
      }
      if (st.artistName) {
        document.getElementById('player-artist').textContent = st.artistName;
        document.getElementById('pc-artist').textContent = st.artistName;
      }
      // Detect external skip (AirPods double-tap): if the track Spotify is
      // playing differs from what DIG last sent, the user skipped via
      // AirPods/Spotify. Sync DIG's state to match.
      if (st.trackId && st.trackId !== _connectTrackId) {
        console.log(`[DIG connect] external skip detected: ${_connectTrackId} → ${st.trackId}`);
        if (typeof clientLog === 'function') clientLog('connect', 'external skip (AirPods)', { from: _connectTrackId, to: st.trackId });
        _connectTrackId = st.trackId;
        Player._lastPlayStarted = Date.now();
        // Advance dIdx to match — find the track in our queue
        const newIdx = allDiscovery.findIndex(t => t.id === st.trackId);
        if (newIdx >= 0) {
          dIdx = newIdx;
          addToHistory(allDiscovery[dIdx], 'listened');
        }
        // Pre-queue more tracks from the new position
        void _prequeueNextTracks();
      }
      // Detect silent play failure: if Spotify says paused within 5s of our
      // play command, the 204 was a lie — playback didn't actually start.
      // Auto-retry with a deep link as fallback.
      if (st.paused && _connectPlaying) {
        const msSincePlay = Date.now() - (Player._lastPlayStarted || 0);
        if (msSincePlay > 2000 && msSincePlay < 8000 && _connectTrackId) {
          if (typeof clientLog === 'function') clientLog('connect', 'silent play failure — Spotify says paused after 204 OK', { ms: msSincePlay, trackId: _connectTrackId });
          // Try deep link as last resort
          window.location.href = `spotify:track:${_connectTrackId}`;
          _connectPlaying = false;
        }
      }

      // Track ended detection — only if enough time has passed AND we were
      // previously playing (guards against iOS backgrounding + poll resume)
      if (st.paused && st.position === 0 && _connectTrackId && _connectPlaying) {
        const msSincePlay = Date.now() - (Player._lastPlayStarted || 0);
        if (msSincePlay > 5000) {
          console.log('[DIG connect] track ended');
          _connectPlaying = false; // prevent re-firing
          if (Player._onTrackEnd) Player._onTrackEnd();
        }
      } else if (!st.paused) {
        _connectPlaying = true;
      }
    }, 1500);
  }

  // Wire track-end callback
  Player.onTrackEnd = function(fn) { Player._onTrackEnd = fn; };

} else {
  // Desktop: normal Spotify SDK init
  window.onSpotifyWebPlaybackSDKReady = () => Player.init();
}

// Fallback init if SDK doesn't fire (covers both iOS connect + desktop SDK timeout)
setTimeout(() => { if (!Player.isReady()) Player.init(); }, 2000);

// ===== PLAYER LOGIC =====
function currentTrack() { return allDiscovery[dIdx]; }

/** Structured logs for playback / queue debugging (filter console by `[DIG`). */
function playDbg(event, extra = {}) {
  try {
    console.log('[DIG playback]', event, Object.assign({
      dIdx,
      queueLen: allDiscovery.length,
      playingId: currentTrack()?.id,
    }, extra));
  } catch (e) {}
}

let _playLock = false;
let _consecutivePlayFails = 0;
let _hasPlayedThisSession = false;
function playCurrentTrack() {
  if (_playLock) {
    if (typeof clientLog === 'function') clientLog('play', 'playCurrentTrack BLOCKED by _playLock');
    return;
  }
  _playLock = true;
  expMarkDirty();
  const t = currentTrack();
  if (typeof clientLog === 'function') {
    clientLog('play', 'playCurrentTrack', {
      track: t ? `${t.artist} — ${t.name}` : 'NULL',
      id: t?.id, source: t?.source || 'spotify',
      dIdx, queueLen: allDiscovery.length,
    });
  }
  dbg(`playCurrentTrack: ${t ? t.artist+' - '+t.name+' ['+( t.source||'spotify')+'] id='+t.id : 'NO TRACK'}`);
  if (!t) { dbg('no track, returning'); _playLock = false; return; }
  playDbg('playCurrentTrack:start', { id: t.id, name: t.name, artist: t.artist, source: t.source || 'spotify' });
  const regionTag = '';

  // Top bar
  document.getElementById('player-track').textContent = t.name;
  document.getElementById('player-artist').textContent = t.artist;
  document.getElementById('player-region-tag').textContent = regionTag;

  // Big player page
  document.getElementById('pc-track').textContent = t.name;
  document.getElementById('pc-artist').textContent = t.artist;
  // Show AI reason when present, otherwise region
  const subTag = t._aiReason ? `✦ ${t._aiLens || 'AI'}: ${t._aiReason}` : regionTag;
  document.getElementById('pc-region').textContent = subTag;

  // Set album art immediately to avoid a glitch gap before Spotify's
  // player_state_changed event fires with the real artwork URL
  const source = t.source || 'spotify';
  let artUrl = '';
  if (source === 'youtube') {
    let ytId = t.youtube_id || t.id || '';
    if (ytId.startsWith('yt:')) ytId = ytId.slice(3);
    artUrl = `https://img.youtube.com/vi/${ytId}/mqdefault.jpg`;
  }
  if (artUrl) {
    document.getElementById('player-art').innerHTML = `<img src="${artUrl}">`;
    const ba = document.getElementById('big-art');
    ba.innerHTML = `<img src="${artUrl}"><div class="art-overlay heart" id="heart-overlay">♥</div><div class="art-overlay nah" id="nah-overlay">✕</div>`;
    ba.classList.add('has-art');
  } else {
    // For Spotify: clear old art to show a clean ♫ placeholder until
    // the SDK provides the real cover via player_state_changed
    document.getElementById('player-art').innerHTML = '<div class="no-art">♫</div>';
    const ba = document.getElementById('big-art');
    ba.innerHTML = '<div class="no-art">♫</div><div class="art-overlay heart" id="heart-overlay">♥</div><div class="art-overlay nah" id="nah-overlay">✕</div>';
    ba.classList.remove('has-art');
  }

  // Media session metadata (lock screen, AirPods, control center)
  if ('mediaSession' in navigator) {
    navigator.mediaSession.metadata = new MediaMetadata({
